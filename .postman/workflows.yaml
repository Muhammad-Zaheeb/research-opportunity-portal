# This is a Workflow metadata file for defining entity relationships in this workspace.
# Each workflow defines relations between entities and may include optional behavior/settings.
# The Paths are relative to the .postman directory (avoid absolute paths).
# Keep relation entries explicit and avoid duplicate pairs within the same workflow.
# This file is declarative metadata and does not execute workflows by itself.
workflows:
  syncSpecToCollection:
    - spec: >-
        ../postman/specs/Research Opportunity Portal API/Research Opportunity
        Portal API.json
      collection: ../postman/collections/Research-Opportunity-portal-Api
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/University Research Opportunity Portal/index.json
      collection: ../postman/collections/University Research Opportunity Portal-1
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: >-
        ../postman/specs/research-opportunity-portal/postman/research-opportunity-portal.postman_collection.json/research-opportunity-portal.postman_collection.json.json
      collection: ../postman/collections/University Research Opportunity Portal
      options:
        syncExamples: false
        deleteOrphanedRequests: false
  syncCollectionToSpec:
    - spec: >-
        ../postman/specs/Research Opportunity Portal API/Research Opportunity
        Portal API.json
      collection: ../postman/collections/Research-Opportunity-portal-Api
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/University Research Opportunity Portal/index.json
      collection: ../postman/collections/University Research Opportunity Portal-1
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: >-
        ../postman/specs/research-opportunity-portal/postman/research-opportunity-portal.postman_collection.json/research-opportunity-portal.postman_collection.json.json
      collection: ../postman/collections/University Research Opportunity Portal
      options:
        syncExamples: false
        deleteOrphanedRequests: false
