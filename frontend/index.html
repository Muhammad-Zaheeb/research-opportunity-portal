<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Opportunity Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            University Research Opportunity Portal
        </span>
    </div>
</nav>

<div class="container py-4">

    <div id="message"></div>

    <div class="row g-4">

        <!-- Create / Update Form -->
        <div class="col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 id="formTitle" class="mb-3">
                        Create Opportunity
                    </h4>

                    <form id="opportunityForm">

                        <input type="hidden" id="opportunityId">

                        <div class="mb-3">
                            <label class="form-label">
                                Research Title *
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Research Description *
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                required
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Research Area *
                            </label>

                            <input
                                type="text"
                                id="research_area"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Faculty Member Name *
                            </label>

                            <input
                                type="text"
                                id="faculty_name"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Department *
                            </label>

                            <input
                                type="text"
                                id="department"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Required Skills *
                            </label>

                            <input
                                type="text"
                                id="required_skills"
                                class="form-control"
                                placeholder="Python, SQL, Machine Learning"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Available Positions *
                            </label>

                            <input
                                type="number"
                                id="available_positions"
                                class="form-control"
                                min="1"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Application Deadline *
                            </label>

                            <input
                                type="date"
                                id="application_deadline"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Status *
                            </label>

                            <select id="status" class="form-select">
                                <option value="Open">Open</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                id="submitButton"
                                class="btn btn-primary"
                            >
                                Create Opportunity
                            </button>

                            <button
                                type="button"
                                id="cancelButton"
                                class="btn btn-secondary d-none"
                            >
                                Cancel Edit
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>


        <!-- Opportunities -->
        <div class="col-lg-7">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="mb-0">
                    Research Opportunities
                </h4>

                <button
                    class="btn btn-outline-primary btn-sm"
                    onclick="loadOpportunities()"
                >
                    Refresh
                </button>

            </div>

            <div id="opportunitiesList"></div>

        </div>

    </div>

</div>


<!-- Details Modal -->

<div
    class="modal fade"
    id="detailsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="detailsTitle"
                >
                    Opportunity Details
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div
                class="modal-body"
                id="detailsBody"
            ></div>

        </div>

    </div>
</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>

</body>
</html>
